[package]
name = "snn-lm"
version = "0.1.0"
edition = "2021"
description = "Ternary HadamRNN language model with SNN long-context memory"
license = "MIT OR Apache-2.0"

[dependencies]
snn-memory = { path = ".." }
candle-core = "0.9"
candle-nn = "0.9"
rayon = "1.10"
memmap2 = "0.9"
parquet = { version = "56", default-features = false, features = ["snap", "zstd"] }
